global:
  resolve_timeout: 5m

route:
  receiver: telegram-medium
  group_by: [alertname, product, environment, server_id, strategy, severity]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # New rules enter shadow mode first: Prometheus evaluates and exposes them,
    # but Alertmanager does not notify until the canary review promotes them.
    - matchers: [notification_mode="shadow"]
      receiver: shadow-null
      continue: false
    - matchers: [severity="High"]
      receiver: telegram-high
      group_wait: 0s
      repeat_interval: 30m
      continue: false
    - matchers: [severity="Medium"]
      receiver: telegram-medium
      active_time_intervals: [work-hours]
      continue: false
    - matchers: [severity="Low"]
      receiver: telegram-low
      group_interval: 24h
      repeat_interval: 24h
      continue: false

inhibit_rules:
  - source_matchers: [alertname="TradingCriticalSafetyState"]
    target_matchers: [alertname=~"TradingCritical(Log|Warn)Event"]
    equal: [product, environment, server_id, strategy]

time_intervals:
  - name: work-hours
    time_intervals:
      - times: [{ start_time: '09:00', end_time: '21:00' }]
        location: Asia/Taipei

receivers:
  - name: shadow-null

  - name: telegram-high
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/tg_token
        chat_id: -1003712147883
        parse_mode: HTML
        disable_notifications: false
        send_resolved: true
        message: |-
          <b>{{ if eq .Status "firing" }}🚨 High FIRING{{ else }}✅ High RESOLVED{{ end }} — {{ .GroupLabels.alertname }}</b>
          {{ if .GroupLabels.product }}Product: <code>{{ .GroupLabels.product }}</code>{{ end }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{- end }}
          {{ if .CommonAnnotations.runbook_url }}
          📖 <a href="{{ .CommonAnnotations.runbook_url }}">Runbook</a>{{ end }}

  - name: telegram-medium
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/tg_token
        chat_id: -1003712147883
        parse_mode: HTML
        disable_notifications: true
        send_resolved: true
        message: |-
          <b>{{ if eq .Status "firing" }}⚠️ Medium FIRING{{ else }}✅ Medium RESOLVED{{ end }} — {{ .GroupLabels.alertname }}</b>
          {{ if .GroupLabels.product }}Product: <code>{{ .GroupLabels.product }}</code>{{ end }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{- end }}
          {{ if .CommonAnnotations.runbook_url }}
          📖 <a href="{{ .CommonAnnotations.runbook_url }}">Runbook</a>{{ end }}

  # DailyHeartbeat 走這裡 — silent push、24h 一次。訊息留在 chat 證明 AM→Telegram pipeline 還活著。
  - name: telegram-low
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/tg_token
        chat_id: -1003712147883
        parse_mode: HTML
        disable_notifications: true
        send_resolved: false
        message: |-
          <b>ℹ️ Low — {{ .GroupLabels.alertname }}</b>
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{- end }}
