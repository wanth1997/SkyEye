global:
  resolve_timeout: 5m

# Mail addresses stay in an untracked file because this repo is public. A missing
# file is fine; one with a syntax error stops Alertmanager from starting, which
# takes Telegram down too. See runbooks/trading-alert-promotion.md before adding it.
templates:
  - /etc/alertmanager/secrets/*.tmpl

route:
  receiver: telegram-medium
  group_by: [alertname, product, environment, server_id, strategy, severity]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # New rules enter shadow mode first: Prometheus evaluates and exposes them,
    # but Alertmanager does not notify until the canary review promotes them.
    - matchers: [notification_mode="shadow"]
      receiver: shadow-null
      continue: false
    # Email keeps its own route so a stalled mail server cannot hold up Telegram:
    # sharing one receiver would block every later Telegram message of the group.
    # Only promoted alerts reach it until the real canary passes.
    - matchers: [severity="High", notification_mode="page"]
      receiver: email-high
      group_wait: 0s
      repeat_interval: 30m
      continue: true
    - matchers: [severity="High"]
      receiver: telegram-high
      group_wait: 0s
      repeat_interval: 30m
      continue: false
    - matchers: [severity="Medium"]
      receiver: telegram-medium
      active_time_intervals: [work-hours]
      continue: false
    - matchers: [severity="Low"]
      receiver: telegram-low
      group_interval: 24h
      repeat_interval: 24h
      continue: false

inhibit_rules:
  # A shadow source never notifies, so it must not silence a promoted target.
  - source_matchers: [alertname="TradingCriticalSafetyState", notification_mode!="shadow"]
    target_matchers: [alertname=~"TradingCritical(Log|Warn)Event"]
    equal: [product, environment, server_id, strategy]

time_intervals:
  - name: work-hours
    time_intervals:
      - times: [{ start_time: '09:00', end_time: '21:00' }]
        location: Asia/Taipei

receivers:
  - name: shadow-null

  - name: telegram-high
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/tg_token
        chat_id: -1003712147883
        parse_mode: HTML
        disable_notifications: false
        send_resolved: true
        message: |-
          <b>{{ if eq .Status "firing" }}🚨 High FIRING{{ else }}✅ High RESOLVED{{ end }} — {{ .GroupLabels.alertname }}</b>
          {{ if .GroupLabels.product }}Product: <code>{{ .GroupLabels.product }}</code>{{ end }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{- end }}
          {{ if .CommonAnnotations.runbook_url }}
          📖 <a href="{{ .CommonAnnotations.runbook_url }}">Runbook</a>{{ end }}

  # example.invalid values are placeholders until the mail settings are filled in.
  # Nothing reaches this receiver before then: no alert is notification_mode=page.
  - name: email-high
    email_configs:
      - to: '{{ template "skyeye.email.to" . }}'
        from: '{{ template "skyeye.email.from" . }}'
        smarthost: smtp.example.invalid:587
        auth_username: smtp-user@example.invalid
        auth_password_file: /etc/alertmanager/secrets/smtp_password
        send_resolved: true
        headers:
          Subject: '[SkyEye High] {{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }} {{ .GroupLabels.alertname }}'
        html: ''
        text: |-
          {{ if eq .Status "firing" }}High FIRING{{ else }}High RESOLVED{{ end }} - {{ .GroupLabels.alertname }}
          {{ if .GroupLabels.product }}Product: {{ .GroupLabels.product }}{{ end }}
          {{ range .Alerts }}
          - {{ .Annotations.summary }}
          {{- end }}
          {{ if .CommonAnnotations.runbook_url }}
          Runbook: {{ .CommonAnnotations.runbook_url }}{{ end }}

  - name: telegram-medium
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/tg_token
        chat_id: -1003712147883
        parse_mode: HTML
        disable_notifications: true
        send_resolved: true
        message: |-
          <b>{{ if eq .Status "firing" }}⚠️ Medium FIRING{{ else }}✅ Medium RESOLVED{{ end }} — {{ .GroupLabels.alertname }}</b>
          {{ if .GroupLabels.product }}Product: <code>{{ .GroupLabels.product }}</code>{{ end }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{- end }}
          {{ if .CommonAnnotations.runbook_url }}
          📖 <a href="{{ .CommonAnnotations.runbook_url }}">Runbook</a>{{ end }}

  # DailyHeartbeat 走這裡 — silent push、24h 一次。訊息留在 chat 證明 AM→Telegram pipeline 還活著。
  - name: telegram-low
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/tg_token
        chat_id: -1003712147883
        parse_mode: HTML
        disable_notifications: true
        send_resolved: false
        message: |-
          <b>ℹ️ Low — {{ .GroupLabels.alertname }}</b>
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{- end }}
