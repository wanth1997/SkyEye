global:
  resolve_timeout: 5m

# Mail addresses stay in an untracked file because this repo is public. A missing
# file is fine; one with a syntax error stops Alertmanager from starting, which
# takes Telegram down too. See runbooks/trading-alert-promotion.md before adding it.
templates:
  - /etc/alertmanager/secrets/*.tmpl

route:
  receiver: telegram-medium
  group_by: [alertname, product, environment, server_id, strategy, severity]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Must stay first: the dead man's switch only proves the pipeline when it
    # reaches the external heartbeat service, whatever labels other routes match.
    # Pings every 5-6 minutes (repeat is checked on each 1m flush). It is not a
    # shadow rule: the external service is its canary, see
    # runbooks/skyeye-watchdog.md.
    - matchers: [alertname="SkyEyeWatchdog"]
      receiver: deadman-external
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m
      continue: false
    # New rules enter shadow mode first: Prometheus evaluates and exposes them,
    # but Alertmanager does not notify until the canary review promotes them.
    - matchers: [notification_mode="shadow"]
      receiver: shadow-null
      continue: false
    # Email keeps its own route so a stalled mail server cannot hold up Telegram:
    # sharing one receiver would block every later Telegram message of the group.
    # Only promoted alerts reach it until the real canary passes.
    - matchers: [severity="High", notification_mode="page"]
      receiver: email-high
      group_wait: 0s
      repeat_interval: 30m
      continue: true
    # Runner pool High alerts (PoolHostOffline, PoolHostStatusMissing) repeat
    # every 4h instead of 30m so an overnight outage does not spam Telegram,
    # and group per server_id so each host notifies and resolves independently.
    # Placed after shadow (shadow alerts stay suppressed) and email-high
    # (promoted page alerts still reach email first), before general High.
    - matchers: [product="runner-pool", severity="High"]
      receiver: telegram-high
      group_by: [alertname, product, server_id, severity]
      group_wait: 0s
      repeat_interval: 4h
      continue: false
    # PoolHostBriefOffline clears after ~30m. Under the general Medium route's
    # work-hours window, an overnight reboot that resolves before 09:00 would
    # never be delivered; this route delivers silently 24/7 via telegram-medium.
    - matchers: [product="runner-pool", alertname="PoolHostBriefOffline"]
      receiver: telegram-medium
      continue: false
    - matchers: [severity="High"]
      receiver: telegram-high
      group_wait: 0s
      repeat_interval: 30m
      continue: false
    - matchers: [severity="Medium"]
      receiver: telegram-medium
      active_time_intervals: [work-hours]
      continue: false
    - matchers: [severity="Low"]
      receiver: telegram-low
      group_interval: 24h
      repeat_interval: 24h
      continue: false

inhibit_rules:
  # A shadow source never notifies, so it must not silence a promoted target.
  - source_matchers: [alertname="TradingCriticalSafetyState", notification_mode!="shadow"]
    target_matchers: [alertname=~"TradingCritical(Log|Warn)Event"]
    equal: [product, environment, server_id, strategy]

time_intervals:
  - name: work-hours
    time_intervals:
      - times: [{ start_time: '09:00', end_time: '21:00' }]
        location: Asia/Taipei

receivers:
  - name: shadow-null

  # The ping URL is a credential: it lives in secrets/deadman_url, never in Git.
  # Alertmanager reads the file at every send, so placing it needs no reload.
  # Until it exists every send fails at once with "read url_file: ... no such
  # file" (one log line per minute, no retry, nothing leaves the host) and the
  # other receivers are unaffected. A plain webhook POST to a secret URL, so any
  # heartbeat service that counts a 2xx-answered POST as a ping works.
  - name: deadman-external
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/deadman_url
        send_resolved: false
        max_alerts: 1

  - name: telegram-high
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/tg_token
        chat_id: -1003712147883
        parse_mode: HTML
        disable_notifications: false
        send_resolved: true
        message: |-
          <b>{{ if eq .Status "firing" }}🚨 High FIRING{{ else }}✅ High RESOLVED{{ end }} — {{ .GroupLabels.alertname }}</b>
          {{ if .GroupLabels.product }}Product: <code>{{ .GroupLabels.product }}</code>{{ end }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{- end }}
          {{ if .CommonAnnotations.runbook_url }}
          📖 <a href="{{ .CommonAnnotations.runbook_url }}">Runbook</a>{{ end }}

  # example.invalid values are placeholders until the mail settings are filled in.
  # Nothing reaches this receiver before then: no alert is notification_mode=page.
  - name: email-high
    email_configs:
      - to: '{{ template "skyeye.email.to" . }}'
        from: '{{ template "skyeye.email.from" . }}'
        smarthost: smtp.example.invalid:587
        auth_username: smtp-user@example.invalid
        auth_password_file: /etc/alertmanager/secrets/smtp_password
        send_resolved: true
        headers:
          Subject: '[SkyEye High] {{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }} {{ .GroupLabels.alertname }}'
        html: ''
        text: |-
          {{ if eq .Status "firing" }}High FIRING{{ else }}High RESOLVED{{ end }} - {{ .GroupLabels.alertname }}
          {{ if .GroupLabels.product }}Product: {{ .GroupLabels.product }}{{ end }}
          {{ range .Alerts }}
          - {{ .Annotations.summary }}
          {{- end }}
          {{ if .CommonAnnotations.runbook_url }}
          Runbook: {{ .CommonAnnotations.runbook_url }}{{ end }}

  - name: telegram-medium
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/tg_token
        chat_id: -1003712147883
        parse_mode: HTML
        disable_notifications: true
        send_resolved: true
        message: |-
          <b>{{ if eq .Status "firing" }}⚠️ Medium FIRING{{ else }}✅ Medium RESOLVED{{ end }} — {{ .GroupLabels.alertname }}</b>
          {{ if .GroupLabels.product }}Product: <code>{{ .GroupLabels.product }}</code>{{ end }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{- end }}
          {{ if .CommonAnnotations.runbook_url }}
          📖 <a href="{{ .CommonAnnotations.runbook_url }}">Runbook</a>{{ end }}

  # DailyHeartbeat 走這裡 — silent push、24h 一次。訊息留在 chat 證明 AM→Telegram pipeline 還活著。
  - name: telegram-low
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/tg_token
        chat_id: -1003712147883
        parse_mode: HTML
        disable_notifications: true
        send_resolved: false
        message: |-
          <b>ℹ️ Low — {{ .GroupLabels.alertname }}</b>
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{- end }}
