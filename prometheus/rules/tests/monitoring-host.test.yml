rule_files:
  - ../system.yml

evaluation_interval: 30s

# Every series carries the labels the monitoring-host scrape job produces:
# job, instance and server_id prove that alerts name the central host rather
# than node-exporter:9100. The rule group evaluates every 30s, and a value of
# 25 out of 100 is 25% free.
tests:
  - name: healthy root disk, memory and an old OOM count stay silent
    interval: 30s
    input_series:
      - series: 'node_filesystem_avail_bytes{device="/dev/root",fstype="ext4",instance="monitoring-prod",job="monitoring-host",mountpoint="/",product="skyeye",server_id="monitoring-prod"}'
        values: '68x60'
      - series: 'node_filesystem_size_bytes{device="/dev/root",fstype="ext4",instance="monitoring-prod",job="monitoring-host",mountpoint="/",product="skyeye",server_id="monitoring-prod"}'
        values: '100x60'
      - series: 'node_memory_MemAvailable_bytes{instance="monitoring-prod",job="monitoring-host",product="skyeye",server_id="monitoring-prod"}'
        values: '50x60'
      - series: 'node_memory_MemTotal_bytes{instance="monitoring-prod",job="monitoring-host",product="skyeye",server_id="monitoring-prod"}'
        values: '100x60'
      # Kills from before the exporter started must not page on its first scrape.
      - series: 'node_vmstat_oom_kill{instance="monitoring-prod",job="monitoring-host",product="skyeye",server_id="monitoring-prod"}'
        values: '7x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: HostDiskLow
        exp_alerts: []
      - eval_time: 20m
        alertname: HostDiskCritical
        exp_alerts: []
      - eval_time: 20m
        alertname: HostMemoryHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: HostOOM
        exp_alerts: []

  - name: root disk under 20 percent raises HostDiskLow but not HostDiskCritical
    interval: 30s
    input_series:
      - series: 'node_filesystem_avail_bytes{device="/dev/root",fstype="ext4",instance="monitoring-prod",job="monitoring-host",mountpoint="/",product="skyeye",server_id="monitoring-prod"}'
        values: '19x40'
      - series: 'node_filesystem_size_bytes{device="/dev/root",fstype="ext4",instance="monitoring-prod",job="monitoring-host",mountpoint="/",product="skyeye",server_id="monitoring-prod"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: HostDiskLow
        exp_alerts: []
      - eval_time: 11m
        alertname: HostDiskLow
        exp_alerts:
          - exp_labels:
              severity: Medium
              device: /dev/root
              fstype: ext4
              instance: monitoring-prod
              job: monitoring-host
              mountpoint: /
              product: skyeye
              server_id: monitoring-prod
            exp_annotations:
              summary: "monitoring-prod disk < 20%"
              runbook_url: "https://github.com/wanth1997/SkyEye/blob/master/runbooks/disk-full.md"
      - eval_time: 11m
        alertname: HostDiskCritical
        exp_alerts: []

  - name: root disk under 5 percent pages through HostDiskCritical
    interval: 30s
    input_series:
      - series: 'node_filesystem_avail_bytes{device="/dev/root",fstype="ext4",instance="monitoring-prod",job="monitoring-host",mountpoint="/",product="skyeye",server_id="monitoring-prod"}'
        values: '4x40'
      - series: 'node_filesystem_size_bytes{device="/dev/root",fstype="ext4",instance="monitoring-prod",job="monitoring-host",mountpoint="/",product="skyeye",server_id="monitoring-prod"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: HostDiskCritical
        exp_alerts: []
      - eval_time: 6m
        alertname: HostDiskCritical
        exp_alerts:
          - exp_labels:
              severity: High
              device: /dev/root
              fstype: ext4
              instance: monitoring-prod
              job: monitoring-host
              mountpoint: /
              product: skyeye
              server_id: monitoring-prod
            exp_annotations:
              summary: "monitoring-prod disk < 5% — imminent failure"
              runbook_url: "https://github.com/wanth1997/SkyEye/blob/master/runbooks/disk-full.md"

  # /boot filling up is outside these rules: they watch the root filesystem only.
  - name: a full non-root filesystem does not raise the root disk alerts
    interval: 30s
    input_series:
      - series: 'node_filesystem_avail_bytes{device="/dev/nvme0n1p15",fstype="vfat",instance="monitoring-prod",job="monitoring-host",mountpoint="/boot/efi",product="skyeye",server_id="monitoring-prod"}'
        values: '1x40'
      - series: 'node_filesystem_size_bytes{device="/dev/nvme0n1p15",fstype="vfat",instance="monitoring-prod",job="monitoring-host",mountpoint="/boot/efi",product="skyeye",server_id="monitoring-prod"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: HostDiskLow
        exp_alerts: []
      - eval_time: 15m
        alertname: HostDiskCritical
        exp_alerts: []

  - name: memory and OOM alerts carry the monitoring-prod labels
    interval: 30s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="monitoring-prod",job="monitoring-host",product="skyeye",server_id="monitoring-prod"}'
        values: '5x40'
      - series: 'node_memory_MemTotal_bytes{instance="monitoring-prod",job="monitoring-host",product="skyeye",server_id="monitoring-prod"}'
        values: '100x40'
      - series: 'node_vmstat_oom_kill{instance="monitoring-prod",job="monitoring-host",product="skyeye",server_id="monitoring-prod"}'
        values: '7x4 8x36'
    alert_rule_test:
      - eval_time: 16m
        alertname: HostMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: Medium
              instance: monitoring-prod
              job: monitoring-host
              product: skyeye
              server_id: monitoring-prod
            exp_annotations:
              summary: "monitoring-prod memory > 90% for 15min"
      - eval_time: 3m30s
        alertname: HostOOM
        exp_alerts:
          - exp_labels:
              severity: High
              instance: monitoring-prod
              job: monitoring-host
              product: skyeye
              server_id: monitoring-prod
            exp_annotations:
              summary: "monitoring-prod OOM killer activated"
              runbook_url: "https://github.com/wanth1997/SkyEye/blob/master/runbooks/oom.md"

  - name: sustained CPU load names the host by instance and product
    interval: 30s
    input_series:
      # One core, 0.05 idle seconds per second of wall clock: 95% busy.
      - series: 'node_cpu_seconds_total{cpu="0",instance="monitoring-prod",job="monitoring-host",mode="idle",product="skyeye",server_id="monitoring-prod"}'
        values: '0+1.5x40'
    alert_rule_test:
      - eval_time: 16m
        alertname: HostHighCPU
        exp_alerts:
          - exp_labels:
              severity: Medium
              instance: monitoring-prod
              product: skyeye
            exp_annotations:
              summary: "monitoring-prod CPU > 85% for 10min"
              runbook_url: "https://github.com/wanth1997/SkyEye/blob/master/runbooks/high-cpu.md"
