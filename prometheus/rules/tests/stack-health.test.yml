rule_files:
  - ../stack-health.yml

evaluation_interval: 30s

tests:
  # 25s of a 30s interval is over 80%. The same 25s of a 60s interval is not: the
  # rule compares a group with its own schedule, not with a fixed number of seconds.
  - name: a group near its own interval fires after 15 minutes and others stay quiet
    interval: 30s
    input_series:
      - series: 'prometheus_rule_group_last_duration_seconds{rule_group="slow"}'
        values: '25x60'
      - series: 'prometheus_rule_group_interval_seconds{rule_group="slow"}'
        values: '30x60'
      - series: 'prometheus_rule_group_last_duration_seconds{rule_group="roomy"}'
        values: '25x60'
      - series: 'prometheus_rule_group_interval_seconds{rule_group="roomy"}'
        values: '60x60'
      - series: 'prometheus_rule_group_last_duration_seconds{rule_group="fast"}'
        values: '0.1x60'
      - series: 'prometheus_rule_group_interval_seconds{rule_group="fast"}'
        values: '30x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: PrometheusRuleEvalSlow
        exp_alerts: []
      - eval_time: 20m
        alertname: PrometheusRuleEvalSlow
        exp_alerts:
          - exp_labels:
              severity: Medium
              notification_mode: shadow
              rule_group: slow
            exp_annotations:
              summary: "Rule group slow uses > 80% of its interval for 15min — cardinality or query cost spike"

  - name: a slow spike shorter than 15 minutes does not fire
    interval: 30s
    input_series:
      - series: 'prometheus_rule_group_last_duration_seconds{rule_group="spiky"}'
        values: '1x10 25x20 1x30'
      - series: 'prometheus_rule_group_interval_seconds{rule_group="spiky"}'
        values: '30x60'
    alert_rule_test:
      - eval_time: 16m
        alertname: PrometheusRuleEvalSlow
        exp_alerts: []
      - eval_time: 25m
        alertname: PrometheusRuleEvalSlow
        exp_alerts: []

  - name: one skipped run fires at once and clears when it leaves the window
    interval: 1m
    input_series:
      - series: 'prometheus_rule_group_iterations_missed_total{rule_group="busy",instance="a"}'
        values: '0x10 1x30'
      - series: 'prometheus_rule_group_iterations_missed_total{rule_group="calm",instance="a"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: PrometheusRuleIterationsMissed
        exp_alerts: []
      - eval_time: 12m
        alertname: PrometheusRuleIterationsMissed
        exp_alerts:
          - exp_labels:
              severity: Medium
              notification_mode: shadow
              rule_group: busy
            exp_annotations:
              summary: "Rule group busy skipped evaluations in the last 15min"
      - eval_time: 30m
        alertname: PrometheusRuleIterationsMissed
        exp_alerts: []

  - name: a Prometheus restart resetting the counter is not a skipped run
    interval: 1m
    input_series:
      - series: 'prometheus_rule_group_iterations_missed_total{rule_group="busy"}'
        values: '5x10 0x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: PrometheusRuleIterationsMissed
        exp_alerts: []

  # Remote Alloy agents report up{job="integrations/unix"}; the central
  # node-exporter (job monitoring-host) must not hide a tunnel outage.
  # PROD02 stops sending at 5m and stays visible for the 5 minute lookback;
  # trading01 keeps sending up == 0. So no agent is up from 10m, firing at 15m.
  - name: every remote agent going silent fires once after 5 minutes
    interval: 30s
    input_series:
      - series: 'up{job="integrations/unix",instance="PROD02",product="ppclub",server_id="PROD02"}'
        values: '1x10'
      - series: 'up{job="integrations/unix",instance="trading01",product="tnauqquant",server_id="trading01"}'
        values: '1x10 0x30'
      - series: 'up{job="monitoring-host",instance="node-exporter:9100"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: AllRemoteAgentsSilent
        exp_alerts: []
      - eval_time: 9m
        alertname: AllRemoteAgentsSilent
        exp_alerts: []
      - eval_time: 14m
        alertname: AllRemoteAgentsSilent
        exp_alerts: []
      - eval_time: 16m
        alertname: AllRemoteAgentsSilent
        exp_alerts:
          - exp_labels:
              severity: High
              notification_mode: shadow
            exp_annotations:
              summary: "No remote agent is delivering metrics — check cloudflared and the Access service token"
              runbook_url: "https://github.com/wanth1997/SkyEye/blob/master/runbooks/all-remote-agents-silent.md"

  - name: one remote agent still delivering keeps AllRemoteAgentsSilent quiet
    interval: 30s
    input_series:
      - series: 'up{job="integrations/unix",instance="PROD02",product="ppclub",server_id="PROD02"}'
        values: '1x40'
      - series: 'up{job="integrations/unix",instance="trading01",product="tnauqquant",server_id="trading01"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: AllRemoteAgentsSilent
        exp_alerts: []

  # Until alertmanager/secrets/deadman_url exists every watchdog ping fails;
  # that must not page through Telegram, but a Telegram failure still must.
  - name: webhook failures do not fire AlertmanagerNotifyFailures, Telegram failures do
    interval: 30s
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="webhook",reason="other",instance="alertmanager:9093",job="alertmanager"}'
        values: '0+1x80'
      - series: 'alertmanager_notifications_failed_total{integration="telegram",reason="other",instance="alertmanager:9093",job="alertmanager"}'
        values: '0x20 1+1x60'
      - series: 'alertmanager_notifications_failed_total{integration="email",reason="other",instance="alertmanager:9093",job="alertmanager"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 25m
        alertname: AlertmanagerNotifyFailures
        exp_alerts: []
      - eval_time: 38m
        alertname: AlertmanagerNotifyFailures
        exp_alerts:
          - exp_labels:
              severity: Medium
              integration: telegram
            exp_annotations:
              summary: "Alertmanager failing to deliver via telegram for 15min"
