rule_files:
  - ../deadman.yml

evaluation_interval: 1m

tests:
  # The gauge holds a unix timestamp; promtool evaluates from time() = 0, so a
  # series that keeps value 0 is "last run at t=0" and one that rises with the
  # clock (60 per minute) is a job that keeps running.
  - name: a stale instance does not page while another instance keeps the job fresh
    interval: 1m
    input_series:
      - series: 'ppc_scheduled_job_last_run_timestamp{job="ppclub-backend",exported_job="auto_power_courts",instance="localhost:8090",product="ppclub",server_id="PROD02"}'
        values: '0x80'
      - series: 'ppc_scheduled_job_last_run_timestamp{job="ppclub-backend",exported_job="auto_power_courts",instance="localhost:8091",product="ppclub",server_id="PROD02"}'
        values: '0+60x80'
    alert_rule_test:
      - eval_time: 70m
        alertname: SchedulerNoHeartbeat
        exp_alerts: []

  - name: the job pages once every instance has been silent for an hour
    interval: 1m
    input_series:
      - series: 'ppc_scheduled_job_last_run_timestamp{job="ppclub-backend",exported_job="auto_power_courts",instance="localhost:8090",product="ppclub",server_id="PROD02"}'
        values: '0x80'
      - series: 'ppc_scheduled_job_last_run_timestamp{job="ppclub-backend",exported_job="auto_power_courts",instance="localhost:8091",product="ppclub",server_id="PROD02"}'
        values: '0+60x5 300x75'
      - series: 'ppc_scheduled_job_last_run_timestamp{job="ppclub-backend",exported_job="reconcile_pending_payments",instance="localhost:8091",product="ppclub",server_id="PROD02"}'
        values: '0+60x80'
    alert_rule_test:
      - eval_time: 64m
        alertname: SchedulerNoHeartbeat
        exp_alerts: []
      - eval_time: 72m
        alertname: SchedulerNoHeartbeat
        exp_alerts:
          - exp_labels:
              severity: High
              product: ppclub
              server_id: PROD02
              exported_job: auto_power_courts
            exp_annotations:
              summary: "ppclub scheduler job 'auto_power_courts' silent for > 1hr"
              runbook_url: "https://github.com/wanth1997/SkyEye/blob/master/runbooks/scheduler-dead.md"

  # prometheus_tsdb_head_max_time is in milliseconds. A head that keeps up with
  # the clock rises 60000 per minute; a frozen head keeps its last value.
  - name: the watchdog fires while the TSDB head advances
    interval: 1m
    input_series:
      - series: 'prometheus_tsdb_head_max_time{job="prometheus",instance="localhost:9090"}'
        values: '0+60000x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: SkyEyeWatchdog
        exp_alerts: &watchdog
          - exp_labels:
              severity: None
              job: prometheus
              instance: localhost:9090
            exp_annotations:
              summary: "SkyEye rule evaluation, TSDB writes and Alertmanager are alive"
              runbook_url: "https://github.com/wanth1997/SkyEye/blob/master/runbooks/skyeye-watchdog.md"
      - eval_time: 30m
        alertname: SkyEyeWatchdog
        exp_alerts: *watchdog
      - eval_time: 30m
        alertname: PrometheusSelfStale
        exp_alerts: []

  - name: the watchdog stops within 2 minutes of the TSDB head freezing
    interval: 1m
    input_series:
      # The head advances to t=10m, then stays there while the clock goes on.
      - series: 'prometheus_tsdb_head_max_time{job="prometheus",instance="localhost:9090"}'
        values: '0+60000x10 600000x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: SkyEyeWatchdog
        exp_alerts: *watchdog
      - eval_time: 11m
        alertname: SkyEyeWatchdog
        exp_alerts: *watchdog
      - eval_time: 12m
        alertname: SkyEyeWatchdog
        exp_alerts: []
      - eval_time: 25m
        alertname: SkyEyeWatchdog
        exp_alerts: []

  - name: the watchdog stops when the self-scrape is no longer written
    interval: 1m
    input_series:
      # The series ends at t=10m; after the 5 minute lookback it is gone.
      - series: 'prometheus_tsdb_head_max_time{job="prometheus",instance="localhost:9090"}'
        values: '0+60000x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: SkyEyeWatchdog
        exp_alerts: *watchdog
      - eval_time: 16m
        alertname: SkyEyeWatchdog
        exp_alerts: []
