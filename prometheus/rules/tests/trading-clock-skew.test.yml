rule_files:
  - fixtures/trading-targets.yml
  - ../trading.yml

evaluation_interval: 30s

tests:
  - name: a frozen probe timestamp from the future is not fresh
    interval: 30s
    input_series:
      - series: 'tnauqquant_probe_timestamp_seconds{product="tnauqquant",environment="production",server_id="macmini-m2",strategy="toobit-mexc-btc"}'
        values: '4200x40'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="TradingTelemetryMissing",alertstate="firing",server_id="macmini-m2",strategy="toobit-mexc-btc"})'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: skew inside the freshness window stays fresh
    interval: 30s
    input_series:
      - series: 'tnauqquant_probe_timestamp_seconds{product="tnauqquant",environment="production",server_id="macmini-m2",strategy="toobit-mexc-btc"}'
        values: '60+30x40'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="TradingTelemetryMissing",alertstate="firing",server_id="macmini-m2",strategy="toobit-mexc-btc"})'
        eval_time: 5m
        exp_samples: []

  - name: a P&L sample from the future is stale while the run is expected
    interval: 30s
    input_series:
      - series: 'tnauqquant_run_expected{product="tnauqquant",environment="production",server_id="macmini-m2",strategy="toobit-mexc-btc"}'
        values: '1x40'
      - series: 'tnauqquant_current_pnl_valid{product="tnauqquant",environment="production",server_id="macmini-m2",strategy="toobit-mexc-btc"}'
        values: '1x40'
      - series: 'tnauqquant_pnl_sample_timestamp_seconds{product="tnauqquant",environment="production",server_id="macmini-m2",strategy="toobit-mexc-btc"}'
        values: '4200x40'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="TradingPnlTelemetryStale",alertstate="firing",server_id="macmini-m2"})'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: a history build timestamp from the future is unavailable
    interval: 30s
    input_series:
      - series: 'tnauqquant_pnl_history_valid{product="tnauqquant",environment="production",server_id="macmini-m2",strategy="toobit-mexc-btc"}'
        values: '1x40'
      - series: 'tnauqquant_pnl_history_build_timestamp_seconds{product="tnauqquant",environment="production",server_id="macmini-m2",strategy="toobit-mexc-btc"}'
        values: '4200x40'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="TradingPnlHistoryUnavailable",alertstate="firing",server_id="macmini-m2"})'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: position sample time follows the inventory
    interval: 30s
    input_series:
      - series: 'tnauqquant_position_sample_timestamp_seconds{product="tnauqquant",environment="production",server_id="macmini-m2",strategy="toobit-mexc-btc",source="venue"}'
        values: '100x4'
      - series: 'tnauqquant_position_sample_timestamp_seconds{product="tnauqquant",environment="production",server_id="unknown-host",strategy="not-inventoried",source="venue"}'
        values: '100x4'
    promql_expr_test:
      - expr: 'trading_strategy_position_sample_timestamp_seconds'
        eval_time: 1m
        exp_samples:
          - labels: 'trading_strategy_position_sample_timestamp_seconds{product="tnauqquant",environment="production",server_id="macmini-m2",strategy="toobit-mexc-btc",source="venue"}'
            value: 100
