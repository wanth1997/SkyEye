# Cap every container's json-file log. Docker's default is unbounded, and
# Loki's per-query stdout log had grown to 14 GB on the 30 GB root disk.
# Takes effect when a container is (re)created, e.g. `docker compose up -d`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    logging: *default-logging
    volumes:
      # Mount whole directory (not individual file) so edits that change inode
      # — like atomic-rename editors — propagate into the container.
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --web.enable-admin-api          # needed for /api/v1/admin/tsdb/snapshot
      - --web.external-url=http://prometheus:9090
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      # Mount whole directory (includes ./alertmanager/secrets/) so file
      # edits via atomic rename propagate without needing container restart.
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://alertmanager:9093
    ports:
      - "127.0.0.1:9093:9093"

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
      # Bind-mount overlays the named volume for the rules subtree only;
      # ruler reads from /loki/rules/<tenant>/*.yml. tenant=fake (auth_enabled=false).
      - ./loki/rules:/loki/rules:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    # Loki reads AWS creds from EC2 instance profile via IMDSv2.
    # No env var needed.

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - prometheus
      - loki
      - alertmanager
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PW}
      - GF_SERVER_ROOT_URL=https://grafana.wanbrain.com
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      # --- Cloudflare Access SSO: Grafana verifies the Access JWT itself ---
      # Access signs Cf-Access-Jwt-Assertion on every request it lets through.
      # Grafana checks that signature against the team's keys plus aud and iss,
      # so an email header sent from the host or another container proves
      # nothing. The team domain and the application AUD tag are not secrets:
      # both sit in every token a signed-in browser holds. A wrong value locks
      # everyone out; recovery is in docs/operations.md (Grafana sign-in).
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_PROXY_ENABLED=false
      - GF_AUTH_JWT_ENABLED=true
      - GF_AUTH_JWT_HEADER_NAME=Cf-Access-Jwt-Assertion
      - GF_AUTH_JWT_EMAIL_CLAIM=email
      - GF_AUTH_JWT_USERNAME_CLAIM=email
      - GF_AUTH_JWT_JWK_SET_URL=https://wanbrain.cloudflareaccess.com/cdn-cgi/access/certs
      - GF_AUTH_JWT_EXPECT_CLAIMS={"aud":"8c644c58373633322838aab86cd8c32b37a1342564a14da054d16312174c6e89","iss":"https://wanbrain.cloudflareaccess.com"}
      # Grafana fetches Cloudflare's keys again only when this cache expires, so
      # after a key rotation sign-in fails for up to this long.
      - GF_AUTH_JWT_CACHE_TTL=5m
      - GF_AUTH_JWT_AUTO_SIGN_UP=true
      # Roles live in Grafana. With role sync on, Grafana refuses to change the
      # role of a JWT user, and an Access token carries no role to sync.
      - GF_AUTH_JWT_SKIP_ORG_ROLE_SYNC=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      # Default landing dashboard after login
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/Overview/overview-all.json
      # --- Disable anonymous + snapshots ---
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./blackbox:/etc/blackbox_exporter:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    ports:
      - "127.0.0.1:9115:9115"

  # Host CPU/memory/disk for monitoring-prod. No published port: Prometheus
  # scrapes it on the compose network, so node_network_* and netstat describe
  # this container, not the host. pid: host reads the host's mount table, which
  # keeps the container's own /etc/hosts-style mounts out of node_filesystem_*.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    logging: *default-logging
    # The Hosts dashboard selects on nodename; without this it is the container
    # ID and changes on every recreate.
    hostname: monitoring-prod
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - grafana
      - prometheus
      - loki
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
